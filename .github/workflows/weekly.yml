name: Monthly Downloader + Parser (sing-box-extended)

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-downloader
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pyyaml geoip2

      - name: Install sing-box-extended
  run: |
    mkdir -p ~/singbox
    cd ~/singbox
    API_URL="https://api.github.com/repos/shtorm-7/sing-box-extended/releases/latest"
    HTTP_CODE=$(curl -sL -o release.json -w "%{http_code}" "$API_URL")
    if [ "$HTTP_CODE" != "200" ]; then
      echo "GitHub API вернул код $HTTP_CODE. Ответ:"
      cat release.json
      exit 1
    fi
    ASSET_URL=$(python3 -c "
    import json
    d = json.load(open('release.json'))
    if 'assets' not in d:
        print('NO_ASSETS')
    else:
        for a in d['assets']:
            if a['name'].endswith('amd64.deb'):
                print(a['browser_download_url'])
                break
    ")
    if [ "$ASSET_URL" = "NO_ASSETS" ] || [ -z "$ASSET_URL" ]; then
      echo "Ассет amd64.deb не найден. Доступные файлы:"
      python3 -c "
    import json
    d = json.load(open('release.json'))
    for a in d.get('assets', []):
        print(a['name'])
    "
      exit 1
    fi
    echo "Скачиваем: $ASSET_URL"
    curl -sL -o sb.deb "$ASSET_URL"
    dpkg-deb -x sb.deb extracted
    BIN_PATH=$(find extracted -type f -name 'sing-box' | head -n 1)
    if [ -z "$BIN_PATH" ]; then
      BIN_PATH=$(find extracted -type f -name 'sing-box-extended' | head -n 1)
    fi
    mv "$BIN_PATH" ./sing-box-extended
    chmod +x ./sing-box-extended
    ./sing-box-extended version

      - name: Run Downloader
        run: python scripts/downloader.py --once

      - name: Sample 100k random lines + gzip
        run: |
          echo "=== До выборки ==="
          wc -l configs.txt 2>/dev/null || { echo "configs.txt нет — прерываем"; exit 1; }
          ls -lh configs.txt
          python - <<'EOF'
          import random, gzip, os
          src = 'configs.txt'
          lines = open(src, encoding='utf-8', errors='ignore').read().splitlines()
          total = len(lines)
          n = min(100_000, total)
          sampled = random.sample(lines, n)
          with gzip.open('configs.txt.gz', 'wt', encoding='utf-8') as f:
              f.write('\n'.join(sampled))
          os.remove(src)
          print(f'✅ sampled {n} / {total} → configs.txt.gz')
          EOF
          echo "=== После выборки ==="
          ls -lh configs.txt.gz
          python -c "import gzip; print('строк в .gz:', len(gzip.open('configs.txt.gz','rt',encoding='utf-8').read().splitlines()))"

      - name: Run Parser
        run: python scripts/parser.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cool-Black.txt Cool-White.txt Cool-Black.yaml Cool-White.yaml \
                  Cool-Black_stats.json Cool-White_stats.json CHANGELOG.md \
                  unsorted-black.txt unsorted-white.txt \
                  configs.txt.gz blacklist_sources.txt
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
            exit 0
          fi
          git commit -m "Monthly: downloader + parser (sing-box-extended) $(date -u +%F)"
          if ! git push origin main 2>/dev/null; then
            echo "Remote ушёл вперёд — делаем rebase с приоритетом наших файлов"
            git fetch origin main
            if ! git rebase -X ours origin/main; then
              echo "Rebase с -X ours не удался — жёстко берём наши версии конфликтных файлов"
              git checkout --ours Cool-Black.txt Cool-White.txt Cool-Black.yaml Cool-White.yaml \
                                Cool-Black_stats.json Cool-White_stats.json CHANGELOG.md \
                                unsorted-black.txt unsorted-white.txt 2>/dev/null || true
              git add Cool-Black.txt Cool-White.txt Cool-Black.yaml Cool-White.yaml \
                      Cool-Black_stats.json Cool-White_stats.json CHANGELOG.md \
                      unsorted-black.txt unsorted-white.txt 2>/dev/null || true
              git rebase --continue || git rebase --skip || true
            fi
            git push origin main
          fi
          echo "✅ Готово: $(git log -1 --oneline)"