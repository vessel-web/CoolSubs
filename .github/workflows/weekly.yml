name: Monthly Downloader + Parser

on:
  schedule:
    - cron: '0 3 1 * *'   # 1-го числа каждого месяца в 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-downloader
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # < 6 часов GitHub Actions

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pyyaml geoip2

      - name: Install Xray
        run: |
          mkdir -p ~/xray
          cd ~/xray
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip
          chmod +x xray
          ./xray version

      - name: Run Downloader
        run: python scripts/downloader.py --once

      - name: Sample 100k random lines + gzip
        run: |
          echo "=== До выборки ==="
          wc -l configs.txt 2>/dev/null || { echo "configs.txt нет — прерываем"; exit 1; }
          ls -lh configs.txt

          python - <<'EOF'
          import random, gzip, os
          src = 'configs.txt'
          lines = open(src, encoding='utf-8', errors='ignore').read().splitlines()
          total = len(lines)
          n = min(100_000, total)
          sampled = random.sample(lines, n)
          with gzip.open('configs.txt.gz', 'wt', encoding='utf-8') as f:
              f.write('\n'.join(sampled))
          os.remove(src)
          print(f'✅ sampled {n} / {total} → configs.txt.gz')
          EOF

          echo "=== После выборки ==="
          ls -lh configs.txt.gz
          python -c "import gzip; print('строк в .gz:', len(gzip.open('configs.txt.gz','rt',encoding='utf-8').read().splitlines()))"

      - name: Run Parser
        run: python scripts/parser.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cool-Black.txt Cool-White.txt Cool-Black.yaml Cool-White.yaml \
                  Cool-Black_stats.json Cool-White_stats.json CHANGELOG.md \
                  unsorted-black.txt unsorted-white.txt \
                  configs.txt.gz blacklist_sources.txt
          git diff --staged --quiet || git commit -m "Monthly: downloader + parser $(date -u +%F)"
          git pull --rebase origin main
          git push
