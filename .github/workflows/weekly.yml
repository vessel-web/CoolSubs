name: Monthly Downloader + Parser

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-downloader
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pyyaml geoip2

      - name: Install Xray
        run: |
          mkdir -p ~/xray
          cd ~/xray
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip
          chmod +x xray
          ./xray version

      - name: Run Downloader
        run: python scripts/downloader.py --once

      - name: Compress configs.txt
        run: |
          echo "До сжатия:"
          wc -l configs.txt 2>/dev/null || echo "configs.txt нет"
          ls -lh configs.txt 2>/dev/null || echo "configs.txt нет"
          gzip -9 configs.txt
          echo "После сжатия:"
          ls -lh configs.txt.gz 2>/dev/null || echo "configs.txt.gz нет"

      - name: Run Parser
        run: python scripts/parser.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cool-Black.txt Cool-White.txt Cool-Black.yaml Cool-White.yaml Cool-Black_stats.json Cool-White_stats.json CHANGELOG.md configs.txt.gz blacklist_sources.txt
          git diff --staged --quiet || git commit -m "Monthly: downloader + parser $(date -u +%F)"
          git pull --rebase origin main
          git push
